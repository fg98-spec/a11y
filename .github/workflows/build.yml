name: 幕间 · GitHub 云构建

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke check
        run: |
          test -f index.html && test -f sw.js && test -f manifest.webmanifest
          node -e "const s=require('fs').readFileSync('index.html','utf8');if(!s.includes('</html>'))throw new Error('incomplete');console.log('static ok')"

      - name: Write build info
        run: |
          printf '{"sha":"%s","run":"%s","builtAt":"%s"}\n' "${GITHUB_SHA:0:7}" "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
