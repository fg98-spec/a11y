name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p work
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          unzip -o -q "$ZIP" -d work
          ROOT=$(find work -path "*/app/src/main/AndroidManifest.xml" | head -1 | sed 's|/app/src/main/AndroidManifest.xml||')
          if [ -z "$ROOT" ]; then
            echo "找不到项目根目录"
            find work -maxdepth 4
            exit 1
          fi
          echo "ROOT=$ROOT" >> $GITHUB_ENV
          echo "根目录 = $ROOT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          SDKM=$(command -v sdkmanager || find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" || true
          fi
          echo "SDK 就绪"

      - name: Normalize
        run: |
          cd "$ROOT"
          echo "=== 原始文件 ==="
          find app/src -type f
          MJ=$(find . -iname "MainActivity.java" | head -1)
          HT=$(find . -iname "index.html" | head -1)
          echo "找到 Java = $MJ"
          echo "找到 HTML = $HT"
          if [ -z "$MJ" ]; then echo "❌ zip 里没有 MainActivity.java"; exit 1; fi
          if [ -z "$HT" ]; then echo "❌ zip 里没有 index.html"; exit 1; fi
          mkdir -p /tmp/keep
          cp "$MJ" /tmp/keep/MainActivity.java
          cp "$HT" /tmp/keep/index.html
          rm -rf app/src/main/java app/src/main/assets app/src/main/aidl app/src/main/res
          rm -rf .gradle build app/build
          mkdir -p app/src/main/java/com/ripple/a11y app/src/main/assets
          cp /tmp/keep/MainActivity.java app/src/main/java/com/ripple/a11y/MainActivity.java
          cp /tmp/keep/index.html app/src/main/assets/index.html
          sed -i 's/^package [^;]*;/package com.ripple.a11y;/' app/src/main/java/com/ripple/a11y/MainActivity.java
          echo "=== 修正后 ==="
          find app/src -type f
          head -3 app/src/main/java/com/ripple/a11y/MainActivity.java
          cat > settings.gradle <<'EOF'
          pluginManagement {
          repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
          repositories { google(); mavenCentral() }
          }
          rootProject.name = "A11y"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
          namespace 'com.ripple.a11y'
          compileSdk 35
          defaultConfig {
          applicationId "com.ripple.a11y"
          minSdk 26
          targetSdk 35
          versionCode 1
          versionName "1.0"
          }
          compileOptions {
          sourceCompatibility JavaVersion.VERSION_17
          targetCompatibility JavaVersion.VERSION_17
          }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
          <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS" />
          <application
          android:label="无障碍管家"
          android:icon="@android:drawable/sym_def_app_icon"
          android:theme="@android:style/Theme.Material.NoActionBar"
          android:allowBackup="true">
          <activity
          android:name=".MainActivity"
          android:exported="true"
          android:configChanges="orientation|screenSize|keyboardHidden|uiMode">
          <intent-filter>
          <action android:name="android.intent.action.MAIN" />
          <category android:name="android.intent.category.LAUNCHER" />
          </intent-filter>
          </activity>
          </application>
          </manifest>
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: |
          cd "$ROOT"
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          CODE=$?
          echo "########## 编译错误 ##########"
          grep -n -E "error:|错误:|\.java:[0-9]+|What went wrong|Execution failed" build.log | head -40
          echo "########## 日志尾部 ##########"
          tail -40 build.log
          exit $CODE

      - uses: actions/upload-artifact@v4
        with:
          name: a11y-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
